name: Release

# Publishing a release v1.2.3 moves the v1 tag to it, so `uses: maxgfr/starsmith@v1` follows.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Move the major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $TAG is not vX.Y.Z"
            exit 1
          fi
          MAJOR="v${BASH_REMATCH[1]}"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
